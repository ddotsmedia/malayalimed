services:
  mm-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mm}
      POSTGRES_DB: malayalimed
    volumes:
      - mm-postgres-data:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm -d malayalimed"]
      interval: 10s
      timeout: 5s
      retries: 5

  mm-redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

  mm-web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    env_file: ../../.env.production
    environment:
      NODE_ENV: production
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      mm-postgres:
        condition: service_healthy

volumes:
  mm-postgres-data:
